esphome:
  name: sauna-xiao-esp32c6
  friendly_name: sauna_xiao_c6
  on_boot:
    priority: -5
    then:
      - lambda: |-
          auto call = id(climate_sauna).make_call();
          call.set_mode(climate::CLIMATE_MODE_OFF);
          call.perform();
          id(sauna_minutes_on) = 0;
          id(low_power) = true;   // ensure LCD starts in low-power (off)

ota:
  platform: esphome  # or auto-detect
  password: !secret esphome_ota_password

time:
  - platform: homeassistant
    id: ha_time

esp32:
  board: esp32-c6-devkitm-1
  framework:
    type: esp-idf
    version: 5.5.1

logger:
  level: DEBUG

globals:
  - id: sauna_minutes_on
    type: int
    restore_value: no
    initial_value: '0'
  - id: low_power
    type: bool
    restore_value: no
    initial_value: 'true'
  - id: sauna_start_time
    type: unsigned long
    restore_value: no
    initial_value: '0'
  - id: sauna_max_runtime
    type: int
    initial_value: '10800'  # 3 hours in seconds

interval:
  - interval: 1000ms
    then:
      - lambda: |-
          if (id(climate_sauna).mode == climate::CLIMATE_MODE_HEAT && id(sauna_start_time) > 0) {
            unsigned long elapsed_ms = millis() - id(sauna_start_time);
            id(sauna_minutes_on) = elapsed_ms / 60000UL;
          }
  - interval: 30s
    then:
      - if:
          condition:
            lambda: |-
              bool heating = id(climate_sauna).mode == climate::CLIMATE_MODE_HEAT;
              unsigned long elapsed_s = heating ? (millis() - id(sauna_start_time)) / 1000UL : 0;
              return heating && elapsed_s >= id(sauna_max_runtime);
          then:
            - logger.log: "Sauna auto-off after 3h"
            - lambda: |-
                auto call = id(climate_sauna).make_call();
                call.set_mode(climate::CLIMATE_MODE_OFF);
                call.perform();
            - lambda: |-
                id(sauna_start_time) = 0;
                id(sauna_minutes_on) = 0;

api:
  encryption:
    key: !secret esphome_api_key

wifi:
  ssid: !secret wifi_ssid_shed
  password: !secret wifi_password

  fast_connect: false
  power_save_mode: none

  ap:
    ssid: "Sauna-XIAO Fallback"
    password: !secret sauna_ap_password

  manual_ip:
    static_ip: 192.168.100.14
    gateway: 192.168.100.1
    subnet: 255.255.255.0
  use_address: 192.168.100.14

# Physical buttons
binary_sensor:
  - platform: gpio
    id: btn_mode
    pin:
      number: GPIO21       # D3
      mode:
        input: true
        pullup: true
    on_press:
      then:
        - button.press: btn_sauna_mode
  - platform: gpio
    id: btn_plus
    pin:
      number: GPIO18   # D10
      mode:
        input: true
        pullup: true
    on_press:
      then:
        - lambda: |-
            float t = id(climate_sauna).target_temperature;
            t += 1.0;
            auto call = id(climate_sauna).make_call();
            call.set_target_temperature(t);
            call.perform();

  - platform: gpio
    id: btn_minus
    pin:
      number: GPIO20   # D9
      mode:
        input: true
        pullup: true
    on_press:
      then:
        - lambda: |-
            float t = id(climate_sauna).target_temperature;
            t -= 1.0;
            auto call = id(climate_sauna).make_call();
            call.set_target_temperature(t);
            call.perform();

switch:
  - platform: gpio
    id: heater_relay
    pin: GPIO2

button:
  - platform: template
    name: "Sauna Mode Button"
    id: btn_sauna_mode
    on_press:
      - lambda: |-
          if (id(climate_sauna).mode == climate::CLIMATE_MODE_OFF) {
            // OFF -> HEAT
            id(low_power) = false;
            id(sauna_start_time) = millis();
            auto call = id(climate_sauna).make_call();
            call.set_mode(climate::CLIMATE_MODE_HEAT);
            call.perform();
          } else {
            // HEAT -> OFF
            id(heater_relay).turn_off();
            id(low_power) = true;
            auto call = id(climate_sauna).make_call();
            call.set_mode(climate::CLIMATE_MODE_OFF);
            call.perform();
          }

# DS18B20 on XIAO pin D1 (GPIO1) – adjust if needed
one_wire:
  - platform: gpio
    pin: GPIO1
    id: bus

sensor:
  - platform: dallas_temp
    one_wire_id: bus
    address: 0x6008233038347828
    resolution: 9        # ← try 9 or 10 instead of 12
    name: "Sauna Temp"
    id: sauna_temp
    update_interval: 5s
    filters:
      - filter_out: nan
  - platform: template
    name: "Sauna Minutes On"
    id: sauna_minutes_sensor
    lambda: |-
      return id(sauna_minutes_on);
    unit_of_measurement: "min"
    accuracy_decimals: 0
    force_update: true
    update_interval: 10s

climate:
  - platform: thermostat
    name: "Sauna"
    id: climate_sauna
    sensor: sauna_temp

    heat_deadband: 3.5°C    # relay ON at 84.5°C (target-0.5)
    cool_deadband: 3.0°C    # relay OFF at 82.5°C (target-2.5)
    min_heating_run_time: 10s
    min_heating_off_time: 5s
    min_idle_time: 5s

    heat_action:
      - switch.turn_on: heater_relay
    idle_action:
      - switch.turn_off: heater_relay

    default_preset: Home
    preset:
      - name: Home
        default_target_temperature_low: 85 °C

    visual:
      min_temperature: 30 °C
      max_temperature: 100 °C
      temperature_step:
        target_temperature: 1.0
        current_temperature: 0.1

    on_state:
      - lambda: |-
          static auto last_mode = climate::CLIMATE_MODE_OFF;
          if (last_mode == climate::CLIMATE_MODE_OFF &&
              id(climate_sauna).mode == climate::CLIMATE_MODE_HEAT) {
            id(sauna_minutes_on) = 0;
          }
          last_mode = id(climate_sauna).mode;

# I2C on XIAO ESP32C6: SDA=D4, SCL=D5 [web:225]
i2c:
  sda: GPIO22   # D4
  scl: GPIO23   # D5
  scan: true
  frequency: 50kHz

display:
  - platform: lcd_pcf8574
    dimensions: 21x4
    address: 0x27
    id: sauna_display
    update_interval: 1s
    lambda: |-
      if (id(low_power)) {
        it.no_backlight();
        it.clear();
        return;
      }
      it.backlight();

      // Row 0: Temp
      if (!isnan(id(sauna_temp).state)) {
        it.printf(2, 0, "Temp: %.1f", id(sauna_temp).state);
      } else {
        it.printf(2, 0, "Temp: ----");
      }

      // Row 0: Timer top right
      if (id(climate_sauna).mode == climate::CLIMATE_MODE_HEAT && id(sauna_start_time) > 0) {
        unsigned long ms = millis() - id(sauna_start_time);
        int h = (ms / 3600000UL) % 24;
        int m = (ms / 60000UL) % 60;
        it.printf(15, 0, "%02d:%02d", h, m);
      } else {
        it.printf(15, 0, "OFF");
      }

      // Row 1: Target temp
      it.printf(0, 1, "Target: %.1f", id(climate_sauna).target_temperature);

      // Row 2: Heating state
      if (id(climate_sauna).action == climate::CLIMATE_ACTION_HEATING) {
        it.printf(0, 2, "State: HEAT");
      } else {
        it.printf(0, 2, "State: IDLE");
      }

      // Row 3: Time of day
      auto t = id(ha_time).now();
      if (t.is_valid()) {
        it.printf(0, 3, "%02d:%02d  %02d/%02d/%04d",
          t.hour, t.minute, t.day_of_month, t.month, t.year);
      } else {
        it.printf(0, 3, "Time: syncing...");
      }

